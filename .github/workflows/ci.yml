name: CI

on:
  # Run on every commit pushed to any branch...
  push:
    branches: [ "**" ]
  # ...and on every commit in a branch that becomes a PR targeting main.
  pull_request:
    branches: [ main ]
  # Manual trigger (runs the full suite regardless of branch).
  workflow_dispatch:
  # Nightly full-suite run to catch rare flakes and dependency drift without
  # blocking anyone.
  schedule:
    - cron: "0 2 * * *"

# Cancel any in-progress CI run for the same PR/branch when a new commit
# arrives, so only the latest commit's checks run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint release binaries are built with an older Go and reject
      # the go 1.26 go.mod directive, so build it with the CI toolchain.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -gcflags="all=-N -l" disables inlining/optimization so the mockey
      # test doubles in common/observability take effect (see Makefile run/test).
      - name: Test with coverage
        run: go test -count=1 -gcflags="all=-N -l" -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  integration:
    name: Integration Tests (MySQL + MinIO + Redis + RocketMQ)
    # Heavy job (MySQL + MinIO + Redis + RocketMQ + migrations): pre-submit on
    # PRs to main, post-submit on main pushes, and the scheduled/manual runs.
    # Skipped for ordinary feature-branch pushes.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start infrastructure
        run: docker compose up -d

      # The broker auto-creates a topic only on first publish, but the e2e
      # consumer needs the topic's route info at Start. Create it explicitly
      # once the broker is registered with the name server.
      - name: Create RocketMQ topic
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T rocketmq-broker sh mqadmin updateTopic -n rocketmq-namesrv:9876 -t reporting -c DefaultCluster -r 8 -w 8; then
              exit 0
            fi
            sleep 2
          done
          echo "RocketMQ broker/namesrv did not become ready" && exit 1

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" && exit 1

      - name: Apply migrations
        run: |
          for f in db/migrations/*.up.sql; do
            docker compose exec -T mysql mysql -uroot -proot efficient_report_exporter < "$f"
          done

      - name: Run integration tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_NAME: efficient_report_exporter
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
          TEST_S3_REGION: us-east-1
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
          TEST_MQ_NAMESRV: 127.0.0.1:9876
        run: go test -tags integration -count=1 ./integration/

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color
