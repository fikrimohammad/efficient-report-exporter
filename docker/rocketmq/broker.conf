brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# Advertise a host-reachable address so clients (the test process / host) can
# connect to the broker through the docker port mapping.
brokerIP1 = 127.0.0.1
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
configStoreRootDir = /home/rocketmq/store/config
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
